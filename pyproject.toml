[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seo-manager"
version = "0.2.1"
description = "Unified social media SEO management with analytics and auto-optimization"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # nltk is not used: nothing imports it. Keyword
    # extraction and readability used to download corpora at run time and
    # silently degrade when that failed (see generation/stopwords.py).
    "filelock>=3.9",
    "pyyaml>=6.0",
    # Imported unconditionally in production code paths and so declared
    # here: googleapiclient (youtube_sync.py, health_check.py),
    # cryptography (brand_credentials.py), Pillow (thumbnail_generator.py).
    # `httplib2` is a transitive dep of google-api-python-client and
    # gets pulled in implicitly. A fresh virtualenv surfaces any missing
    # one as a collection ImportError.
    "google-api-python-client>=2.0",
    # The rest of the Google stack. Installs come from THIS file, so a
    # package declared anywhere else is installed nowhere.
    # youtube_sync.py imports `google_auth_oauthlib.flow` unconditionally, so
    # it must be declared here or the sync is dead in every `pip install .`
    # environment.
    # google-auth backs the `google.oauth2` / `google.auth.transport.requests`
    # imports in youtube_sync.py, uploader.py and health_check.py. It reaches
    # us today only as a google-api-python-client dependency, and `requests` —
    # which google.auth.transport.requests needs — only as a google-api-core
    # one; the [requests] extra makes both explicit instead of incidental.
    # google-auth-httplib2 is the transport googleapiclient uses for
    # authorized calls. It too is transitive; declaring it here makes its
    # >=0.4.0 floor apply to every install.
    "google-auth[requests]>=2.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "cryptography>=40.0",
    "Pillow>=10.0",
    "structlog>=23.0",
]

[project.scripts]
seo-manager = "seo_manager.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
    "hypothesis>=6.100",
]

[tool.hatch.build.targets.wheel]
packages = ["seo_manager"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/", "seo_manager/"]

[[tool.mypy.overrides]]
module = ["seo_manager.*"]
ignore_errors = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["."]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["seo_manager"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "F401", "E402"]
"tests/**/*.py" = ["S101", "F401", "E402"]
