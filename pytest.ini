[pytest]
testpaths = tests
# Putting the checkout first keeps the tests and --cov pointed at the same
# ./seo_manager files whether or not the package is also installed.
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage options. The floor (fail_under) lives in .coveragerc, not here:
# this file shadows [tool.pytest.ini_options] in pyproject.toml, so any
# coverage flag there is dead.
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=seo_manager
    --cov-report=term-missing:skip-covered
